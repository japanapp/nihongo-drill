# codemagic.yaml — Japan Go! iOS build → TestFlight
# Builds the Capacitor iOS app from web sources, auto-creates the signing
# certificate + provisioning profile via the App Store Connect API key
# ("JapanGo!" integration), and uploads to TestFlight.

workflows:
  ios-testflight:
    name: Japan Go! iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: JapanGo!

    environment:
      groups:
        - appstore_credentials   # must contain CERTIFICATE_PRIVATE_KEY (added in Codemagic UI)
      vars:
        BUNDLE_ID: "com.habi.japango"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6792918628
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Assemble web bundle (www) and sync Capacitor iOS
        script: |
          node build-www.js
          npx cap sync ios

      - name: Initialize keychain for code signing
        script: |
          keychain initialize

      - name: Fetch (or create) signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add fetched certificate to keychain
        script: |
          keychain add-certificates

      - name: Apply provisioning profiles to Xcode project
        script: |
          xcode-project use-profiles

      - name: Increment build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          cd ios/App
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
          cd "$CM_BUILD_DIR"

      - name: Build iOS app (archive .ipa)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
